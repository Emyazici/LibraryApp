name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore LibraryApp.sln

      - name: Build
        run: dotnet build LibraryApp.sln --no-restore -c Release

      - name: Unit tests
        run: >
          dotnet test LibraryApp.Tests/LibraryApp.Tests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      # Testcontainers starts PostgreSQL through the Docker daemon preinstalled on ubuntu runners.
      - name: Integration tests
        run: >
          dotnet test LibraryApp.IntegrationTests/LibraryApp.IntegrationTests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
